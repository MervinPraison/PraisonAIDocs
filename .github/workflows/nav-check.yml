name: Navigation Consistency

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check_nav.py"
      - ".github/workflows/nav-check.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check_nav.py"

permissions:
  contents: read

jobs:
  nav-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check docs.json navigation consistency
        run: python3 scripts/check_nav.py
